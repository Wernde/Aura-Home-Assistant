
name: AURA Builder Agents

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: Task file inside the repository
        required: true
        default: builder/tasks/home-state-0.9.md
      auto_commit:
        description: Commit changes after checks and release review pass
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - builder/run-requests/aura-builder.json

permissions:
  contents: write

concurrency:
  group: aura-builder-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, aura, builder, ollama]
    timeout-minutes: 60
    steps:
      - name: Checkout AURA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify local tools
        shell: powershell
        run: |
          git --version
          python --version
          node --version
          ollama --version
          ollama list

      - name: Prepare local builder config
        shell: powershell
        run: |
          # The Dell runner has 4 GB RAM. The 4B model consumes almost all of it
          # and regularly exceeds the builder's request timeout.
          $model = 'qwen3:1.7b'
          if (-not (ollama list | Select-String -SimpleMatch $model)) {
            Write-Host "Installing tool-capable local builder model $model..."
            ollama pull $model
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to install required Ollama model $model."
            }
          }

          $configPath = Join-Path $env:RUNNER_TEMP 'aura-builder-config.json'
          Copy-Item builder\config.example.json $configPath -Force
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.model = $model
          $configJson = $config | ConvertTo-Json -Depth 10
          [System.IO.File]::WriteAllText($configPath, $configJson, (New-Object System.Text.UTF8Encoding($false)))

          $taskFile = '${{ inputs.task_file }}'
          $autoCommit = '${{ inputs.auto_commit }}'
          if ('${{ github.event_name }}' -eq 'push') {
            $request = Get-Content builder\run-requests\aura-builder.json -Raw | ConvertFrom-Json
            $taskFile = [string]$request.task_file
            $autoCommit = [string]$request.auto_commit
          }
          if ([string]::IsNullOrWhiteSpace($taskFile)) {
            $taskFile = 'builder/tasks/home-state-0.9.md'
          }
          $autoCommit = $autoCommit.ToLowerInvariant()

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "AURA_BUILDER_CONFIG=$configPath$([Environment]::NewLine)" +
            "AURA_TASK_FILE=$taskFile$([Environment]::NewLine)" +
            "AURA_AUTO_COMMIT=$autoCommit$([Environment]::NewLine)",
            (New-Object System.Text.UTF8Encoding($false))
          )
          git config --global --add safe.directory $env:GITHUB_WORKSPACE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git status --short

      - name: Verify builder orchestration gates
        shell: powershell
        run: python -m unittest discover -s builder/tests -v

      - name: Run AURA Builder Agent Team
        shell: powershell
        run: |
          $args = @(
            'builder\aura_builder.py',
            '--task-file',
            $env:AURA_TASK_FILE,
            '--config',
            $env:AURA_BUILDER_CONFIG
          )
          if ($env:AURA_AUTO_COMMIT -eq 'true') { $args += '--auto-commit' }
          python @args

      - name: Push approved agent commit
        if: ${{ env.AURA_AUTO_COMMIT == 'true' }}
        shell: powershell
        run: |
          if (git status --porcelain) {
            Write-Host 'Runner left uncommitted changes; refusing to push.'
            exit 1
          }
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload builder report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aura-builder-report
          path: builder/runs/
          if-no-files-found: warn
